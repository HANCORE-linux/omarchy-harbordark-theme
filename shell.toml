# Omarchy Quattro surfaces for HarborDark.
# Coral status accents and the original warm active-border gradient preserve
# the legacy Waybar, Walker, Mako, SwayOSD, and Hyprlock character.

[bar]
background = "#1B1B1B"
background-alpha = 1.0
text = "#A99B7A"
active = "#E75A50"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "rgba(a99b7aee) rgba(1B1B1Bee) rgba(1B1B1Bee) rgba(a99b7aee) 0deg"
active-border-foreground = "#A99B7A"

[controls]
normal-color = "#EFEBDC"
normal-fill-alpha = 0.04
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color = "#A99B7A"
hover-cursor-fill-alpha = 0.10
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.48

focus-color = "#E75A50"
focus-fill-alpha = 0.12
focus-border-width = 1
focus-border-alpha = 0.82

selected-color = "#77838A"
selected-fill-alpha = 0.18
selected-border-width = 1
selected-border-alpha = 0.58

pressed-color = "#E58980"
pressed-fill-alpha = 0.24
selection-color = "#E75A50"
selection-fill-alpha = 0.34

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 5
panel-padding = 10

[font]
base-size = 12
heading = 16
icon-large = 18

[popups]
background = "#1B1B1B"
background-alpha = 0.96
text = "#929292"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2

[tooltip]
background = "#1B1B1B"
background-alpha = 0.96
text = "#EFEBDC"
border = "#A99B7A"
border-alpha = 1.0
border-width = 1

[notifications]
background = "#1B1B1B"
background-alpha = 0.96
text = "#EFEBDC"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
countdown = "#E75A50"

[launcher]
background = "#1B1B1B"
background-alpha = 0.96
text = "#929292"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
scrim = "#1B1B1B"
scrim-alpha = 0.0
selected-background = "#1B1B1B"
selected-background-alpha = 1.0
selected-text = "#DF7E76"
selected-border = "#A99B7A"
selected-border-alpha = 0.0
selected-border-width = 0

[menu]
background = "#1B1B1B"
background-alpha = 0.96
text = "#929292"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
scrim = "#1B1B1B"
scrim-alpha = 0.0
selected-background = "#1B1B1B"
selected-background-alpha = 1.0
selected-text = "#DF7E76"
selected-border = "#A99B7A"
selected-border-alpha = 0.0
selected-border-width = 0

[polkit]
background = "#1B1B1B"
background-alpha = 0.96
text = "#EFEBDC"
text-error = "#F44336"
border = "hyprland.active-border"
border-error = "#F44336"
border-alpha = 1.0
border-width = 2
scrim = "#1B1B1B"
scrim-alpha = 0.5
accent = "#E75A50"

[lock]
background = "#1B1B1B"
background-alpha = 0.72
text = "#EFEBDC"
placeholder = "#EFEBDCB3"
text-error = "#F44336"
border = "hyprland.active-border"
border-active = "hyprland.active-border"
border-error = "#F44336"
border-alpha = 1.0
border-width = 2
selection = "#E75A50"
selection-alpha = 0.45

[image-picker]
scrim = "#1B1B1B"
scrim-alpha = 0.5
text = "#EFEBDC"
selected-border = "#E75A50"
selected-border-alpha = 1.0
unselected-border = "#A99B7A"
unselected-border-alpha = 0.32
